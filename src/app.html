<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.png" />
    <link
      rel="preload"
      as="image"
      type="image/svg+xml"
      href="/images/iso-grid.svg"
      fetchpriority="high"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      />
    </noscript>
    <title>Antonio Ruiz | UI Engineer</title>
    <meta
      name="description"
      content="I'm Antonio Ruiz, a frontend developer and designer with a passion for creating beautiful and functional web experiences."
    />
    %sveltekit.head%
  </head>
  <body
    class="bg-texture"
    data-sveltekit-preload-data="hover"
    style="margin: 0"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
